<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lab Trends</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body class="lab-trends-page p-4 md:p-5 bg-base-100 text-base-content" data-theme="bumblebee">
  <div class="max-w-[1500px] mx-auto">
    <div class="lab-trends-header mb-4">
      <div class="min-w-0">
        <div class="lab-trends-title-row">
          <h1 class="lab-trends-title">Lab Trends</h1>
          <span id="patient" class="lab-trends-patient"></span>
          <div class="lab-trends-panel-buttons">
            <button id="panelCbc" class="btn btn-xs">CBC</button>
            <button id="panelChem" class="btn btn-xs">Chem</button>
            <button id="panelUa" class="btn btn-xs">UA</button>
            <button id="panelOther" class="btn btn-xs">Other</button>
            <button id="toggleDebugPayload" class="btn btn-xs btn-outline">Debug</button>
            <span class="lab-trends-shortcuts">Use Alt + &#8592; / &#8594; to switch panels</span>
          </div>
        </div>
        <div id="status" class="lab-trends-status">(Waiting for data…)</div>
      </div>
    </div>
    <section id="debugPayloadSection" class="mb-4 hidden">
      <div class="flex items-center gap-2 mb-2">
        <h2 class="text-sm font-semibold">Extraction payload</h2>
        <button id="refreshDebugPayload" class="btn btn-xs">Refresh</button>
        <button id="copyDebugPayload" class="btn btn-xs">Copy</button>
      </div>
      <pre id="debugPayloadDisplay" class="text-xs whitespace-pre-wrap bg-base-200 rounded p-3 max-h-80 overflow-auto border border-base-300"></pre>
    </section>
    <div id="trendsLayout" class="flex flex-col gap-4">
      <div id="panels" class="relative w-full min-w-0 overflow-visible"></div>
    </div>
  </div>

  <dialog id="resultModal" class="modal">
    <div class="modal-box max-w-2xl">
      <h3 class="font-semibold text-lg">Full Result</h3>
      <div id="resultModalContent" class="mt-3 text-sm whitespace-pre-wrap"></div>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn btn-sm">Close</button>
        </form>
      </div>
    </div>
  </dialog>

  <script type="module" src="/trends/trends.js"></script>
</body>

</html>
